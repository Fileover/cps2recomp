#
# Street Fighter Alpha: Warriors' Dreams (Capcom 1995, CPS-2 arcade board): per-game settings read by the
# cps2recomp toolkit (Makefile, tools and launcher via tools/gamecfg.py).

name = Street Fighter Alpha
# The series the collection's launcher puts it under, with the other games of it
series = Street Fighter Alpha
# What the window is called (the name stays the folder the player's settings are kept under)
title = Street Fighter Alpha Recomp
id = sfa
app_id = io.github.tmcleroy.sfa
disclaimer = Not affiliated with Capcom.

# The ROM set this port is made from, as arcade ROM collections name it, and the name the launcher shows.
# sfa is the parent set.
rom_set = sfa
rom_parent =
rom_name = Street Fighter Alpha: Warriors' Dreams (Europe 950727)

# The set's files, each with its CRC32 (file:crc ...), in the order they sit on the board.
# program: the 68000's ROMs (16-bit words). graphics: four files side by side per row (64-bit words);
# this board has only the last row of sockets filled, so the list starts at @800000.
# sound_program: the Z80's ROMs. samples: the QSound chip's. key: the board's cipher key.
program = sfze.03d:ebf2054d sfz.04b:8b73b0e5 sfz.05a:0810544d sfz.06:806e8f38
graphics = @800000 sfz.14m:90fefdb3 sfz.16m:5354c948 sfz.18m:41a1e790 sfz.20m:a549df98
sound_program = sfz.01:ffffec7d sfz.02:45f46a08
samples = sfz.11m:c4b093cd sfz.12m:8bdbc4b4
key = sfa.key:7c095631

# Other sets of the same game this port plays as well: other regions whose program is the same code as this set's
# (the region in the header, or in one instruction: region_at), with the same graphics and sound. One a line:
# set | name | its program files | its key.
other_set = sfzbr1 | Street Fighter Zero (Brazil 950727) | sfzb.03e:ecba89a3 sfz.04b:8b73b0e5 sfz.05a:0810544d sfz.06:806e8f38 | sfzb.key:b0570359
# Where the region is put in a variable (move.w #region,d16(a5)), not read from the header: with another set the
# variable is given that set's region once the instruction is past (the translated code has this set's).
region_at = 001078
# The program's words where these sets and this one differ as the game reads them (both as on the chips and
# deciphered: the region, the checksum and the like; elsewhere only the cipher's other view differs). Online, the
# host sends its own, so two players with different sets play as the host's.
online_words = 00107A 010F9A
# (and the bytes the ROM check adds up, every 4,095th of each 512 KB as on the chips, where these differ)
online_words = 000000 000FFE 001FFE 002FFC 003FFC 004FFA 005FFA 006FF8 007FF8 008FF6 00BFF4 00CFF2
online_words = 00FFF0 010FEE 011FEE 012FEC 013FEC 014FEA 015FEA 016FE8 018FE6 019FE6 01BFE4 01CFE2
online_words = 01DFE2 01EFE0 020FDE 021FDE 022FDC 023FDC 024FDA 025FDA 026FD8 027FD8 028FD6 029FD6
online_words = 02AFD4 02BFD4 02CFD2 02DFD2 02EFD0 02FFD0 030FCE 031FCE 032FCC 033FCC 034FCA 035FCA
online_words = 036FC8 037FC8 038FC6 03AFC4 03BFC4 03CFC2 03DFC2 041FBE 042FBC 043FBC 044FBA 045FBA
online_words = 048FB6 049FB6 04AFB4 04BFB4 04CFB2 04DFB2 04FFB0 051FAE 052FAC 053FAC

# Features whose switch is on the launcher's first page, under "Full screen": name | title | what it says
display = widescreen | Widescreen | Fights are shown and played in 16:9, with more of the stage on each side.

# The launcher's Multi game page's modes this game takes part in (endless: its endless battle, every stage once;
# --multi, fight/battle.h)
multi = endless

# Where the game's code ends in the 68000's ROM (hex): the translator does not look past this
code_end = 100000

# Features that help made-up play get far when looking for the game's code ('make explore')
explore_features = free_play,no_damage,one_hit
# ... and with which one made-up player wins every match, for the one-player game to its end
explore_ladder_features = free_play,no_damage,one_hit

# Capcom's video library, native in the toolkit (video/lifts.cpp, docs/NATIVE_VIDEO.md): where this game's copy of
# each part is. video_palette_commit: the routine, and its version (a CRC-32 of its instruction words, operands left
# out); video_writes: the instructions that write the video's registers (the palette's, the object registers, the object
# bank, the scrolls and layers: the toolkit checks each is a move or clr it reads)
video_palette_commit = 0012CE:770DFAA6
video_writes = 000988 000998 0009A0 0009A8 0009B0 0009B8 0009D6 0009DE 0009E6 0009EE 0009F6 0009FE
video_writes = 000A06 000A2E 000A36 000A3E 000A46 000BC4 000BCC 000BD4 000BDC 000BE4 000BEC 000BF4
video_writes = 000BFA 000C00 000C06 000C0C 000C12 000C1A 000C22 000C2A 000C32 000C3A 000C42 000C4A
video_writes = 000E28 000E46 001048 0011DE 0011F4 0011FC 00120A 001218 001226 001234 00123C 001244
video_writes = 00124C 0015B8 0015CC 0015D2 0016A6 0016B8 0016CC 0016DE 0016EC 001700 001714

# The games whose stages it shows, each run from its own stage code alone (fight/all_guests.h, in that order, and
# fight/guest_stages.h; their sets from their own game.cfg). None is needed to play: without them, only this game's.
guests = dstlk vampire_savior sfa2 sfa3 ssf2t nwarr msh xmvsf mshvsf mvsc xmcota pocket_fighter cybots
