#
# Darkstalkers: The Night Warriors (Capcom 1994, CPS-2 arcade board): per-game settings read by the
# cps2recomp toolkit (Makefile, tools and launcher via tools/gamecfg.py).

name = Darkstalkers
# The series the collection's launcher puts it under, with the other games of it
series = Darkstalkers
# What the window is called (the name stays the folder the player's settings are kept under)
title = Darkstalkers Recomp
id = dstlk
app_id = io.github.tmcleroy.darkstalkers
disclaimer = Not affiliated with Capcom.

# Features whose switch is on the launcher's first page, under "Full screen": name | title | what it says
# The ROM set this port is made from, as arcade ROM collections name it, and the name the launcher shows
rom_set = dstlk
# (a parent set itself)
rom_parent = dstlk
rom_name = Darkstalkers: The Night Warriors (Europe 940705)

# The set's files, each with its CRC32 (file:crc ...), in the order they sit on the board.
program = vame.03a:004c9cff vame.04a:ae413ff2 vame.05a:60678756 vame.06a:912870b3 vame.07a:dabae3e8 vame.08a:2c6e3077 vame.09a:f16db74b vame.10a:701e2147
graphics = vam.13m:c51baf99 vam.15m:3ce83c77 vam.17m:4f2408e0 vam.19m:9ff60250 vam.14m:bd87243c vam.16m:afec855f vam.18m:3a033625 vam.20m:2bff6a89
sound_program = vam.01:64b685d5 vam.02:cf7c97c7
samples = vam.11m:4a39deb2 vam.12m:1a3e5c03
key = dstlk.key:cfa46dec

# Where the game's code ends in the 68000's ROM (hex): the translator does not look past this
code_end = 120000

# Features that help made-up play get far when looking for the game's code ('make explore')
explore_features =
# ... and with which one made-up player wins every match, for the one-player game to its end
explore_ladder_features =

# check_release.sh: how many of the ladder's pictures the build with no translated code may show a frame early
release_allowed = 150

