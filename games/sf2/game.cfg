#
# Street Fighter II: The World Warrior (Capcom 1991, CPS-1 arcade board): per-game settings read by the cps2recomp
# toolkit (Makefile, tools and launcher via tools/gamecfg.py), with YM2151 and OKI MSM6295 sound.

# (no colon: the name is also the folder the player's settings are kept under, and Windows refuses one)
name = Street Fighter II The World Warrior
# The series the collection's launcher puts it under, with the other games of it
series = Street Fighter II
# What the window is called (the name stays the folder the player's settings are kept under)
title = Street Fighter II The World Warrior Recomp
id = sf2
app_id = io.github.tmcleroy.sf2
disclaimer = Not affiliated with Capcom.

# The ROM set this port is made from, as arcade ROM collections name it, and the name the launcher shows.
# sf2 is the World release of 910522, the parent set and the last revision.
rom_set = sf2
rom_parent =
rom_name = Street Fighter II: The World Warrior (World 910522)

# The board: a classic CPS-1 with no QSound and a 10 MHz 68000 (MAME's cps1_10MHz). Its CPS-B chip is the CPS-B-11
# (MAME's table): layer control, the four priority masks, palette control, the layer enable bits, then its ID
# register and what it reads (byte offsets, hex)
board = cps1-classic pairs=4
cps_b = 26 28 2A 2C 2E 30 08 10 20 32 0401
cpu_clock = 10
# Its graphics mapper (the PAL STF29, as MAME's table has it: Champion Edition's ranges): three banks, the objects in
# order, the three scroll screens' tiles in the third bank
gfx_map = 8000 8000 8000 | objects:0-7fff:0 objects:8000-ffff:1 objects:10000-11fff:2 scroll3:2000-3fff:2 scroll1:4000-4fff:2 scroll2:5000-7fff:2
# The DIP switches (banks A, B and C, hex), as the boards left the factory: 1 coin 1 credit, difficulty 3 (normal),
# the demonstrations' sound, continues allowed (MAME's sf2 inputs: Champion Edition's)
dip = FF FC 9F
# The Board page (the menu's and the launcher's): the DIP switches by name, each "As the board is set" (dip, above)
# unless chosen. name | title | bank:bits | description | choice=value ... (MAME's sf2 inputs)
board_option_1 = board_difficulty | Difficulty | B:0-2 | How hard the computer fights. A new board: 3 (normal). The board reads it all the time: it applies at once, as the game next uses it. | 0 (easiest)=7 | 1=6 | 2=5 | 3 (normal)=4 | 4=3 | 5=2 | 6=1 | 7 (hardest)=0
board_option_2 = board_continue | Continue | C:6 | Whether a lost game can be continued. A new board: yes. The board reads it all the time: it applies at once, as the game next uses it. | No=1 | Yes=0
board_option_3 = board_demo_sound | Demo sound | C:5 | Whether the attract mode plays sound. A new board: on. The board reads it all the time: it applies at once, as the game next uses it. | Off=1 | On=0
board_option_4 = board_two_coins | 2 coins to start | A:6 | Two credits to start a game, one to continue. A new board: off. The board reads it all the time: it applies at once, as the game next uses it. | Off=1 | On=0

# Capcom's video library, native in the toolkit (video/lifts.cpp, docs/NATIVE_VIDEO.md): video_writes, the
# instructions that write the video's registers (CPS-A's, and CPS-B's layer control, priority masks and palette
# control; not its multiplier): every move or clr to one in the listing, with those a census over attract mode and
# made-up play saw (CPS2RECOMP_VIDEO_CENSUS)
video_writes = 000436 00043E 000446 00044E 000456 00045E 000466 00048E 000496 00049E 0004A6 0005FE
video_writes = 00061E 00062C 00063A 000648 000656 000AC0 000AC8 000B2A 000B32 0015F4 0015FC 001610
video_writes = 00164C 001654 00165C 00167E 001684 001694 00169C 0016A4 0016AC 00173A 00174C 00175E
video_writes = 001770 00178E 0017AC 0017C0 0017D4 0017E8 0017FC 001816

# The set's files, each with its CRC32 (file:crc ...), in the order they sit on the board.
# program: the 68000's ROMs, four pairs of byte-wide files (even bytes, then odd). graphics: four files side by side
# per row (64-bit words), three rows. sound_program: the Z80's ROM. samples: the OKI MSM6295's. Nothing is enciphered.
program = sf2e_30g.11e:fe39ee33 sf2e_37g.11f:fb92cd74 sf2e_31g.12e:69a0a301 sf2e_38g.12f:5e22db70 sf2e_28g.9e:8bf9f1e5 sf2e_35g.9f:626ef934 sf2_29b.10e:bb4af315 sf2_36b.10f:c02a13eb
graphics = sf2-5m.4a:22c9cc8e sf2-7m.6a:57213be8 sf2-1m.3a:ba529b4f sf2-3m.5a:4b1b33a8 sf2-6m.4c:2c7e2229 sf2-8m.6c:b5548f17 sf2-2m.3c:14b84312 sf2-4m.5c:5e9cd89a sf2-13m.4d:994bfa58 sf2-15m.6d:3e66ad9d sf2-9m.3d:c1befaa8 sf2-11m.5d:0627c831
sound_program = sf2_9.12a:a4823a1b
samples = sf2_18.11c:7f162009 sf2_19.12c:beade53f

players = 2

# Features whose switch is on the launcher's first page, under "Full screen": name | title | what it says
display = widescreen | Widescreen | Fights are shown and played in 16:9, with more of the stage on each side.

# The launcher's Multi game page's modes this game takes part in (endless: its endless battle, every stage once;
# --multi, fight/battle.h)
multi = endless

# The games whose sources this one builds too: Super Turbo's (games/ssf2t/src), which name its places as At(0x...);
# family.h says where they are in this game, and what is this game's own
sources = ssf2t

# Where the game's code ends in the 68000's ROM (hex): the translator does not look past this (the whole program)
code_end = 100000

# The games whose stages it shows, each run from its own stage code alone (fight/all_guests.h, in that order, and
# fight/guest_stages.h; their sets from their own game.cfg). None is needed to play: without them, only this game's.
guests = dstlk vampire_savior sfa2 sfa3 sfa nwarr msh xmvsf mshvsf mvsc xmcota pocket_fighter cybots ssf2t

# Features that help made-up play get far when looking for the game's code ('make explore')
explore_features = free_play,no_damage,one_hit
explore_ladder_features = free_play,no_damage,one_hit
