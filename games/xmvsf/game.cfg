# X-Men vs. Street Fighter (Capcom 1996, CPS-2 arcade board): per-game settings read by the cps2recomp toolkit
# (Makefile, tools and launcher via tools/gamecfg.py).

name = X-Men vs. Street Fighter
# The series the collection's launcher puts it under, with the other games of it
series = Marvel
# What the window is called (the name stays the folder the player's settings are kept under)
title = X-Men vs. Street Fighter Recomp
id = xmvsf
app_id = io.github.tmcleroy.xmvsf
disclaimer = Not affiliated with Capcom or Marvel.

# The ROM set this port is made from, as arcade ROM collections name it, and the name the launcher shows.
# xmvsf is the parent set, and the one FBNeo and Fightcade play (and the one the 2022 co-op hack patches).
rom_set = xmvsf
rom_parent =
rom_name = X-Men Vs. Street Fighter (Europe 961004)

# The set's files, each with its CRC32 (file:crc ...), in the order they sit on the board.
# program: the 68000's ROMs (16-bit words). graphics: four files side by side per row (64-bit words).
# sound_program: the Z80's ROMs. samples: the QSound chip's. key: the board's cipher key.
program = xvse.03f:db06413f xvse.04f:ef015aef xvs.05a:7db6025d xvs.06a:e8e2c75c xvs.07:08f0abed xvs.08:81929675 xvs.09:9641f36b
graphics = xvs.13m:f6684efd xvs.15m:29109221 xvs.17m:92db3474 xvs.19m:3733473c xvs.14m:bcac2e41 xvs.16m:ea04a272 xvs.18m:b0def86a xvs.20m:4b40ff9f
sound_program = xvs.01:3999e93a xvs.02:101bdee9
samples = xvs.11m:9cadcdbc xvs.12m:7b11e460
key = xmvsf.key:d5c07311

# Other sets of the same game this port plays as well: other regions whose program is the same code as this set's
# (the region in the header, or in one instruction: region_at), with the same graphics and sound. One a line:
# set | name | its program files | its key.
other_set = xmvsfur1 | X-Men Vs. Street Fighter (USA 961004) | xvsu.03i:5481155a xvsu.04i:1e236388 xvs.05a:7db6025d xvs.06a:e8e2c75c xvs.07:08f0abed xvs.08:81929675 xvs.09:9641f36b | xmvsfu.key:eca13458
other_set = xmvsfjr2 | X-Men Vs. Street Fighter (Japan 961004) | xvsj.03i:ef24da96 xvsj.04i:70a59b35 xvs.05a:7db6025d xvs.06a:e8e2c75c xvs.07:08f0abed xvs.08:81929675 xvs.09:9641f36b | xmvsfj.key:87576cda
other_set = xmvsfar1 | X-Men Vs. Street Fighter (Asia 961004) | xvsa.03:520054df xvsa.04:13086e55 xvs.05a:7db6025d xvs.06a:e8e2c75c xvs.07:08f0abed xvs.08:81929675 xvs.09:9641f36b | xmvsfa.key:44941468
other_set = xmvsfh | X-Men Vs. Street Fighter (Hispanic 961004) | xvsh.03a:d4fffb04 xvsh.04a:1b4ea638 xvs.05a:7db6025d xvs.06a:e8e2c75c xvs.07:08f0abed xvs.08:81929675 xvs.09:9641f36b | xmvsfh.key:f632a36b
# The program's words where these sets and this one differ as the game reads them (both as on the chips and
# deciphered: the region, the checksum and the like; elsewhere only the cipher's other view differs). Online, the
# host sends its own, so two players with different sets play as the host's.
online_words = 0000C2 0000D0 0000D2
# (and the bytes the boot's ROM check adds up, every 4,095th of each 512 KB as on the chips, where these differ)
online_words = 000000 000FFE 001FFE 002FFC 003FFC 004FFA 005FFA 006FF8 009FF6 00AFF4 00BFF4 00CFF2
online_words = 00DFF2 00EFF0 00FFF0 010FEE 011FEE 012FEC 013FEC 014FEA 015FEA 017FE8 018FE6 019FE6
online_words = 01AFE4 01DFE2 01EFE0 01FFE0 020FDE 021FDE 022FDC 023FDC 024FDA 025FDA 026FD8 027FD8
online_words = 028FD6 029FD6 02AFD4 02BFD4 02CFD2 02DFD2 02EFD0 02FFD0 030FCE 031FCE 032FCC 033FCC
online_words = 034FCA 035FCA 036FC8 037FC8 038FC6 039FC6 03AFC4 03BFC4 03CFC2 03DFC2 03EFC0 03FFC0
online_words = 040FBE 041FBE 042FBC 043FBC 044FBA 045FBA 046FB8 047FB8 048FB6 049FB6 04BFB4 04CFB2
online_words = 04DFB2 052FAC 053FAC 054FAA 055FAA 056FA8 057FA8 058FA6 059FA6 05AFA4 05BFA4 05CFA2
online_words = 05DFA2 05EFA0 064F9A 065F9A 066F98 067F98 068F96 069F96 06AF94 06CF92 06DF92 06EF90
online_words = 06FF90 070F8E 071F8E 072F8C 073F8C 074F8A 075F8A 076F88 077F88 078F86 079F86 07BF84
online_words = 07CF82 07EF80 07FF80 080000 081FFE 082FFC 083FFC 084FFA 089FF6

# Features whose switch is on the launcher's first page, under "Full screen": name | title | what it says
display = widescreen | Widescreen | Fights are shown and played in 16:9, with more of the stage on each side.

# The launcher's Multi game page's modes this game takes part in (endless: its endless battle, every stage once;
# --multi, fight/battle.h)
multi = endless

# Four players' controls: the tag-team modes (the Alternative modes page) give each character of a team a person
# of its own. The board itself reads players 1 and 2.
players = 4

# Where the game's code ends in the 68000's ROM (hex): the translator does not look past this
code_end = 100000

# Features that help made-up play get far when looking for the game's code ('make explore')
explore_features = free_play,no_damage,one_hit
# ... and with which one made-up player wins every match, for the one-player game to its end
explore_ladder_features = free_play,no_damage,one_hit

# check_release.sh: how many of the ladder's pictures the build with no translated code may show a frame early
release_allowed = 150
