#
# Street Fighter II: Champion Edition (Capcom 1992, CPS-1 arcade board): per-game settings read by the cps2recomp
# toolkit (Makefile, tools and launcher via tools/gamecfg.py). A first port: the game as the board plays it,
# translated, with no sources of its own yet, with YM2151 and OKI MSM6295 sound.

# (no colon: the name is also the folder the player's settings are kept under, and Windows refuses one)
name = Street Fighter II Champion Edition
# What the window is called (the name stays the folder the player's settings are kept under)
title = Street Fighter II Champion Edition Recomp
id = sf2ce
app_id = io.github.tmcleroy.sf2ce
disclaimer = Not affiliated with Capcom.

# The ROM set this port is made from, as arcade ROM collections name it, and the name the launcher shows.
# sf2ce is the World release (920513), the parent set.
rom_set = sf2ce
rom_parent = sf2ce
rom_name = Street Fighter II': Champion Edition (World 920513)

# The board: a classic CPS-1, with no QSound (machine/romset.h). Its CPS-B chip (CPS-B-21 as Street Fighter II sets
# it up): layer control, the four priority masks, palette control, the layer enable bits (byte offsets, hex)
board = cps1-classic
cps_b = 26 28 2A 2C 2E 30 02 04 08
# Its graphics mapper (the PAL S9263B, as MAME's table has it): three banks, the objects in order, the three scroll
# screens' tiles in the third bank (machine/romset.h, GfxRange)
gfx_map = 8000 8000 8000 | objects:0-7fff:0 objects:8000-ffff:1 objects:10000-11fff:2 scroll3:2000-3fff:2 scroll1:4000-4fff:2 scroll2:5000-7fff:2
# The DIP switches (banks A, B and C, hex), as the boards left the factory: 1 coin 1 credit, difficulty 3 (normal),
# the demonstrations' sound, continues allowed
dip = FF FC 9F
# The Board page (the menu's and the launcher's): the DIP switches by name, each "As the board is set" (dip, above)
# unless chosen. name | title | bank:bits | description | choice=value ... (MAME's sf2 inputs)
board_option_1 = board_difficulty | Difficulty | B:0-2 | How hard the computer fights. A new board: 3 (normal). The board reads it all the time: it applies at once, as the game next uses it. | 0 (easiest)=7 | 1=6 | 2=5 | 3 (normal)=4 | 4=3 | 5=2 | 6=1 | 7 (hardest)=0
board_option_2 = board_free_play | Free play | C:2 | Start without credits. A new board: off. The board reads it all the time: it applies at once, as the game next uses it. | Off=1 | On=0
board_option_3 = board_continue | Continue | C:6 | Whether a lost game can be continued. A new board: yes. The board reads it all the time: it applies at once, as the game next uses it. | No=1 | Yes=0
board_option_4 = board_demo_sound | Demo sound | C:5 | Whether the attract mode plays sound. A new board: on. The board reads it all the time: it applies at once, as the game next uses it. | Off=1 | On=0
board_option_5 = board_two_coins | 2 coins to start | A:6 | Two credits to start a game, one to continue. A new board: off. The board reads it all the time: it applies at once, as the game next uses it. | Off=1 | On=0

# The Cheats page: writes to the work RAM before every frame while a cheat is on (they apply only while a round is
# fought, FF8008 = 0A). name | title | description | [when ADDR.s=VAL |] choice: ADDR.s=VAL ... Found here with RAM
# dumps through a fight (--dump-ram): the players' records at FF83BE and FF86BE (0x300 apart), health a word at +2A,
# 0x90 full, FFFF knocked out (as in Super Turbo's records); the round's clock a BCD byte at FF8ABE (98, 85, 73...);
# FF8004 0 choosing, 4 the match; FF8008 0A while a round is fought, 0C its end. (The bosses can be chosen in this
# game: no cheat for them.)
cheat_1 = cheat_energy_p1 | Infinite energy, player 1 | Player 1's health is full again every frame. | when FF8008.w=000A | On: FF83E8.w=0090
cheat_2 = cheat_energy_p2 | Infinite energy, player 2 | Player 2's health (the computer's, in a one-player game) is full again every frame. | when FF8008.w=000A | On: FF86E8.w=0090
cheat_3 = cheat_time | Infinite time | The round's clock stays at 99. | when FF8008.w=000A | On: FF8ABE.b=99
cheat_4 = cheat_one_hit | One-hit knockouts | Player 2 (the computer, in a one-player game) goes down with the first hit (its health is set to the least while full, so the hit knocks it out). | when FF86E8.w=0090 | On: FF86E8.w=0001

# The set's files, each with its CRC32 (file:crc ...), in the order they sit on the board.
# program: the 68000's ROMs (16-bit words). graphics: four files side by side per row (64-bit words).
# sound_program: the Z80's ROM. samples: the OKI MSM6295's. No key file: nothing is enciphered.
program = s92e_23b.8f:0aaa1a3a s92_22b.7f:2bbe15ed s92_21a.6f:925a7877
graphics = s92-1m.3a:03b0d852 s92-3m.5a:840289ec s92-2m.4a:cdb5f027 s92-4m.6a:e2799472 s92-5m.7a:ba8a2761 s92-7m.9a:e584bfb5 s92-6m.8a:21e3f87d s92-8m.10a:befc47df s92-10m.3c:960687d5 s92-12m.5c:978ecd18 s92-11m.4c:d6ec9a0a s92-13m.6c:ed2c67f6
sound_program = s92_09.11a:08f6b60e
samples = s92_18.11c:7f162009 s92_19.12c:beade53f

players = 2

# Where the game's code ends in the 68000's ROM (hex): the translator does not look past this (the whole program
# until made-up play shows where the code stops)
code_end = 180000
