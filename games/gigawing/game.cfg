#
# Giga Wing (Takumi/Capcom 1999, CPS-2 arcade board): per-game settings read by the cps2recomp toolkit
# (Makefile, tools and launcher via tools/gamecfg.py).

name = Giga Wing
# What the window is called (the name stays the folder the player's settings are kept under)
title = Giga Wing Recomp
id = gigawing
app_id = io.github.tmcleroy.gigawing
disclaimer = Not affiliated with Capcom or Takumi.

# The ROM set this port is made from, as arcade ROM collections name it, and the name the launcher shows.
# gigawing is the USA release (990222), the parent set.
rom_set = gigawing
rom_parent =
rom_name = Giga Wing (USA 990222)

# The set's files, each with its CRC32 (file:crc ...), in the order they sit on the board.
program = ggwu.03:ac725eb2 ggwu.04:392f4118 ggw.05:3239d642
graphics = ggw.13m:105530a4 ggw.15m:9e774ab9 ggw.17m:466e0ba4 ggw.19m:840c8dea
sound_program = ggw.01:4c6351d5
samples = ggw.11m:e172acf5 ggw.12m:4bee4e8f
key = gigawing.key:5076c26b

# Other sets of the same game this port plays as well: other regions whose program is the same code as this set's
# (the region in the header), with the same graphics and sound. One a line: set | name | its program files | its key.
# (Asia's third file differs in five words of data; Japan's 990223 is another revision, not taken.)
other_set = gigawinga | Giga Wing (Asia 990222) | ggwa.03a:116f8837 ggwa.04a:e6e3f0c4 ggwa.05a:465e8ac9 | gigawinga.key:7401627e
other_set = gigawingh | Giga Wing (Hispanic 990222) | ggwh.03a:b9ee36eb ggwh.04a:72e548fe ggw.05:3239d642 | gigawingh.key:43198223
other_set = gigawingb | Giga Wing (Brazil 990222) | ggwb.03:a1f8a448 ggwb.04:6a423e76 ggw.05:3239d642 | gigawingb.key:5e7805fa
# The program's words where these sets and this one differ as the game reads them: the header's region and checksum,
# Asia's five words of data, and the bytes the boot's ROM check adds up (every 4,095th of each 512 KB, 000234: as on
# the chips, where the keys differ). Online, the host sends its own, so two players with different sets play as the host's.
online_words = 0000C2 0000D0 0000D2 10432E 11102E 111052 11119C 112ECE
online_words = 000000 000FFE 001FFE 002FFC 003FFC 006FF8 007FF8 008FF6 00BFF4 00CFF2 00DFF2 00EFF0
online_words = 00FFF0 010FEE 011FEE 012FEC 013FEC 014FEA 016FE8 017FE8 018FE6 019FE6 01AFE4 01BFE4
online_words = 01FFE0 021FDE 022FDC 023FDC 024FDA 025FDA 026FD8 027FD8 028FD6 029FD6 02BFD4 02DFD2
online_words = 02EFD0 02FFD0 030FCE 031FCE 032FCC 033FCC 034FCA 036FC8 037FC8 038FC6 039FC6 03EFC0
online_words = 03FFC0 040FBE 042FBC 043FBC 045FBA 047FB8 049FB6 04AFB4 04BFB4 04CFB2 04EFB0 04FFB0
online_words = 050FAE 051FAE 053FAC 054FAA 056FA8 057FA8 058FA6 059FA6 05AFA4 05BFA4 05CFA2 05DFA2
online_words = 05FFA0 060F9E 062F9C 063F9C 064F9A 065F9A 067F98 068F96 069F96 06AF94 06BF94 06CF92
online_words = 06DF92 070F8E 072F8C 073F8C 076F88 077F88 078F86 079F86 07CF82 07DF82 07EF80 07FF80
online_words = 080000 082FFC 083FFC 084FFA 085FFA 086FF8 087FF8 088FF6 089FF6 091FEE 0B8FC6 0B9FC6

# Two players, and what the game calls its two buttons (the launcher's Controllers page shows these)
players = 2
buttons = Shot | Bomb

# Where the game's code ends in the 68000's ROM (hex): the translator does not look past this
code_end = 180000

# Features that help made-up play get far when looking for the game's code ('make explore')
explore_features = free_play,invincible
explore_ladder_features = free_play,invincible
release_features = free_play,invincible
