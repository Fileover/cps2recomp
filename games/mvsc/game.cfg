#
# Marvel vs. Capcom: Clash of Super Heroes (Capcom 1998, CPS-2 arcade board): per-game settings read by the cps2recomp
# toolkit (Makefile, tools and launcher via tools/gamecfg.py).

name = Marvel vs. Capcom
# What the window is called (the name stays the folder the player's settings are kept under)
title = Marvel vs. Capcom Recomp
id = mvsc
app_id = io.github.tmcleroy.mvsc
disclaimer = Not affiliated with Capcom or Marvel.

# The ROM set this port is made from, as arcade ROM collections name it, and the name the launcher shows.
# mvsc is the parent set, and the one FBNeo and Fightcade play.
rom_set = mvsc
rom_parent =
rom_name = Marvel Vs. Capcom: Clash of Super Heroes (Europe 980123)

# The set's files, each with its CRC32 (file:crc ...), in the order they sit on the board.
# program: the 68000's ROMs (16-bit words). graphics: four files side by side per row (64-bit words).
# sound_program: the Z80's ROMs. samples: the QSound chip's. key: the board's cipher key.
program = mvce.03a:824e4a90 mvce.04a:436c5a4e mvc.05a:2d8c8e86 mvc.06a:8528e1f5 mvc.07:c3baa32b mvc.08:bc002fcd mvc.09:c67b26df mvc.10:0fdd1e26
graphics = mvc.13m:fa5f74bc mvc.15m:71938a8f mvc.17m:92741d07 mvc.19m:bcb72fc6 mvc.14m:7f1df4e4 mvc.16m:90bd3203 mvc.18m:67aaf727 mvc.20m:8b0bade8
sound_program = mvc.01:41629e95 mvc.02:963abf6b
samples = mvc.11m:850fe663 mvc.12m:7ccb1896
key = mvsc.key:7e101e09

# Other sets of the same game this port plays as well: other regions whose program is the same code as this set's
# (the region in the header, or in one instruction: region_at), with the same graphics and sound. One a line:
# set | name | its program files | its key.
other_set = mvscu | Marvel Vs. Capcom: Clash of Super Heroes (USA 980123) | mvcu.03d:c6007557 mvcu.04d:724b2b20 mvc.05a:2d8c8e86 mvc.06a:8528e1f5 mvc.07:c3baa32b mvc.08:bc002fcd mvc.09:c67b26df mvc.10:0fdd1e26 | mvscu.key:a83db333
other_set = mvscj | Marvel Vs. Capcom: Clash of Super Heroes (Japan 980123) | mvcj.03a:3df18879 mvcj.04a:07d212e8 mvc.05a:2d8c8e86 mvc.06a:8528e1f5 mvc.07:c3baa32b mvc.08:bc002fcd mvc.09:c67b26df mvc.10:0fdd1e26 | mvscj.key:9dedbcaf
other_set = mvsca | Marvel Vs. Capcom: Clash of Super Heroes (Asia 980123) | mvca.03a:2ff4ae25 mvca.04a:f28427ef mvc.05a:2d8c8e86 mvc.06a:8528e1f5 mvc.07:c3baa32b mvc.08:bc002fcd mvc.09:c67b26df mvc.10:0fdd1e26 | mvsca.key:31edaee8
other_set = mvsch | Marvel Vs. Capcom: Clash of Super Heroes (Hispanic 980123) | mvch.03:6a0ec9f7 mvch.04:00f03fa4 mvc.05a:2d8c8e86 mvc.06a:8528e1f5 mvc.07:c3baa32b mvc.08:bc002fcd mvc.09:c67b26df mvc.10:0fdd1e26 | mvsch.key:dd647c0d
other_set = mvscb | Marvel Vs. Capcom: Clash of Super Heroes (Brazil 980123) | mvcb.03a:7155953b mvcb.04a:fb117d0e mvc.05a:2d8c8e86 mvc.06a:8528e1f5 mvc.07:c3baa32b mvc.08:bc002fcd mvc.09:c67b26df mvc.10:0fdd1e26 | mvscb.key:d74a7a3d
