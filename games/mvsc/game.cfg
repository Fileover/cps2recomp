other_set = mvsca | Marvel Vs. Capcom: Clash of Super Heroes (Asia 980123) | mvca.03a:2ff4ae25 mvca.04a:f28427ef mvc.05a:2d8c8e86 mvc.06a:8528e1f5 mvc.07:c3baa32b mvc.08:bc002fcd mvc.09:c67b26df mvc.10:0fdd1e26 | mvsca.key:31edaee8
other_set = mvsch | Marvel Vs. Capcom: Clash of Super Heroes (Hispanic 980123) | mvch.03:6a0ec9f7 mvch.04:00f03fa4 mvc.05a:2d8c8e86 mvc.06a:8528e1f5 mvc.07:c3baa32b mvc.08:bc002fcd mvc.09:c67b26df mvc.10:0fdd1e26 | mvsch.key:dd647c0d
other_set = mvscb | Marvel Vs. Capcom: Clash of Super Heroes (Brazil 980123) | mvcb.03a:7155953b mvcb.04a:fb117d0e mvc.05a:2d8c8e86 mvc.06a:8528e1f5 mvc.07:c3baa32b mvc.08:bc002fcd mvc.09:c67b26df mvc.10:0fdd1e26 | mvscb.key:d74a7a3d
