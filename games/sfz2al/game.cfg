#
# Street Fighter Zero 2 Alpha (Capcom 1996, CPS-2 arcade board): per-game settings read by the
# cps2recomp toolkit (Makefile, tools and launcher via tools/gamecfg.py).

name = Street Fighter Zero 2 Alpha
# The series the collection's launcher puts it under, with the other games of it
series = Street Fighter Alpha
# What the window is called (the name stays the folder the player's settings are kept under)
title = Street Fighter Zero 2 Alpha Recomp
id = sfz2al
app_id = io.github.tmcleroy.sfz2al
disclaimer = Not affiliated with Capcom.

# The ROM set this port is made from, as arcade ROM collections name it, and the name the launcher shows.
# sfz2al is the last revision of the Alpha version (Cammy, Evil Ryu and the rest), and the one played online
# (Fightcade's "Street Fighter Zero 2 Alpha (960826 Asia)"; FBNeo's training mode is made for it).
rom_set = sfz2al
rom_parent =
rom_name = Street Fighter Zero 2 Alpha (Asia 960826)

# The set's files, each with its CRC32 (file:crc ...), in the order they sit on the board.
program = szaa.03:88e7023e szaa.04:ae8ec36e szaa.05:f053a55e szaa.06:cfc0e7a8 szaa.07:5feb8b20 szaa.08:6eb6d412
graphics = sza.13m:4d1f1f22 sza.15m:19cea680 sza.17m:e01b4588 sza.19m:0feeda64 sza.14m:0560c6aa sza.16m:ae940f87 sza.18m:4bc3c8bc sza.20m:39e674c0
sound_program = sza.01:1bc323cf sza.02:ba6a5013
samples = sza.11m:aa47a601 sza.12m:2237bc53
key = sfz2al.key:2904963e

# Features whose switch is on the launcher's first page, under "Full screen": name | title | what it says
display = widescreen | Widescreen | Fights are shown and played in 16:9, with more of the stage on each side.

# The launcher's Multi game page's modes this game takes part in (endless: its endless battle, every stage once;
# --multi, fight/battle.h)
multi = endless

# The games whose sources this one builds too: Alpha 2's (games/sfa2/src), which name its places as At(0x...);
# family.h says where they are in this game, and what is this game's own
sources = sfa2

# Where the game's code ends in the 68000's ROM (hex): the translator does not look past this
code_end = 100000

# Features that help made-up play get far when looking for the game's code ('make explore')
explore_features = free_play
explore_ladder_features = free_play,no_damage,one_hit

# Capcom's video library, native in the toolkit (video/lifts.cpp, docs/NATIVE_VIDEO.md): where this game's copy of
# each part is. video_palette_commit: the routine, and its version (a CRC-32 of its instruction words, operands left
# out); video_writes: the instructions that write the video's registers (the palette's, the object registers, the object
# bank, the scrolls and layers: the toolkit checks each is a move or clr it reads)
video_palette_commit = 00123E:770DFAA6
video_writes = 00091A 00092A 000932 00093A 000942 00094A 000968 000970 000978 000980 000988 000990
video_writes = 000998 0009C0 0009C8 0009D0 0009D8 000B56 000B5E 000B66 000B6E 000B76 000B7E 000B86
video_writes = 000B8C 000B92 000B98 000B9E 000BA4 000BAC 000BB4 000BBC 000BC4 000BCC 000BD4 000BDC
video_writes = 000DBA 000DD8 000FC2 001150 001166 001174 001182 001190 00119E 0011A6 0011AE 0011B6
video_writes = 0013E2 0013EE 0013F4 0014CE 0014E0 0014F4 001506 00151A 00152E 001542

# The games whose stages it shows, each run from its own stage code alone (fight/all_guests.h, in that order, and
# fight/guest_stages.h; their sets from their own game.cfg). None is needed to play: without them, only this game's.
guests = dstlk vampire_savior sfa3 ssf2t sfa nwarr msh xmvsf mshvsf mvsc xmcota pocket_fighter cybots
