#
# Super Street Fighter II Turbo (Capcom 1994, CPS-2 arcade board): per-game settings read by the
# cps2recomp toolkit (Makefile, tools and launcher via tools/gamecfg.py).

name = Super Street Fighter II Turbo
# What the window is called (the name stays the folder the player's settings are kept under)
title = Super Street Fighter II Turbo Recomp
id = ssf2t
app_id = io.github.tmcleroy.ssf2t
disclaimer = Not affiliated with Capcom.

# The ROM set this port is made from, as arcade ROM collections name it, and the name the launcher shows.
# ssf2xjr1 is the Japanese 940223 revision, the one Super Turbo is played on in tournaments and online
# (Fightcade's "Super Street Fighter II X: Grand Master Challenge (Japan 940223)").
rom_set = ssf2xjr1
rom_parent = ssf2t
rom_name = Super Street Fighter II X: Grand Master Challenge (Japan 940223)

# The set's files, each with its CRC32 (file:crc ...), in the order they sit on the board.
# program: the 68000's ROMs (16-bit words). graphics: four files side by side per row (64-bit words), three rows
# here (the first of 2 MB files, then two of 1 MB files). sound_program: the Z80's ROMs. samples: the QSound chip's.
# key: the board's cipher key.
program = sfxj.03c:a7417b79 sfxj.04a:af7767b4 sfxj.05:f4ff18f5 sfxj.06a:260d0370 sfxj.07:1324d02a sfxj.08:2de76f10 sfx.09:642fae3f
graphics = sfx.13m:cf94d275 sfx.15m:5eb703af sfx.17m:ffa60e0f sfx.19m:34e825c5 sfx.14m:b7cc32e7 sfx.16m:8376ad18 sfx.18m:f5b1b336 sfx.20m:459d5c6b sfx.21m:e32854af sfx.23m:760f2927 sfx.25m:1ee90208 sfx.27m:f814400f
sound_program = sfx.01:b47b8835 sfx.02:0022633f
samples = sfx.11m:9bdbd476 sfx.12m:a05e3aab
key = ssf2xj.key:160d1424

# Other sets of the same game this port plays as well: other regions whose program is the same code as this set's
# (the region in the header, or in one instruction: region_at), with the same graphics and sound. One a line:
# set | name | its program files | its key.
other_set = ssf2ta | Super Street Fighter II Turbo (Asia 940223) | sfxa.03c:04b9ff34 sfxa.04a:16ea5f7a sfxa.05:53d61f0c sfxa.06a:066d09b5 sfxa.07:a428257b sfxa.08:39be596c sfx.09:642fae3f | ssf2ta.key:c11fa8e9
# (ssf2xj is not another region but a later revision of the Japanese set, 940311: its code is this set's, a few of its
# tables are not)
other_set = ssf2xj | Super Street Fighter II X: Grand Master Challenge (Japan 940311) | sfxj.03d:50b52b37 sfxj.04a:af7767b4 sfxj.05:f4ff18f5 sfxj.06b:413477c2 sfxj.07a:a18b3d83 sfxj.08:2de76f10 sfx.09:642fae3f | ssf2xj.key:160d1424

# Features whose switch is on the launcher's first page, under "Full screen": name | title | what it says
display = widescreen | Widescreen | Fights are shown and played in 16:9, with more of the stage on each side.

# The launcher's Multi game page's modes this game takes part in (endless: its endless battle, every stage once;
# --multi, fight/battle.h)
multi = endless

# Where the game's code ends in the 68000's ROM (hex): the translator does not look past this. The characters' own
# routines are after the first megabyte (the tables at 100000 name them, from 10FF12 to 2156E2)
code_end = 240000

# Features that help made-up play get far when looking for the game's code ('make explore')
explore_features = free_play,no_damage,one_hit
# ... and with which one made-up player wins every match, for the one-player game to its end
explore_ladder_features = free_play,no_damage,one_hit

# check_release.sh: how many of the ladder's pictures the build with no translated code may show a frame early
release_allowed = 150
