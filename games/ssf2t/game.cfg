online_words = 06CD38 06CD3A 06CD3C 06CD3E 06CD40 06CD42 06CD44 06CD46 06CD48 06CD4A 06CD4C 06CD4E
online_words = 06CD50 06CD52 06CD54 06CD56 06CD58 06CD5A 06CD5C 06CD5E 06CD60 06CD62 06CD64 06CD66
online_words = 06CD68 06CD6A 06CD6C 06CD6E 06CD70 06CD72 06CD74 06CD76 06CD78 06CD7A 06CD7C 06CD7E
online_words = 06CD80 06CD82 06CD84 06CD86 06CD88 06CD8A 06CD8C 06CD8E 06CD90 06CD92 06CD94 06CD96
online_words = 06CD98 06CD9A 06CD9C 06CD9E 06CDA0 06CDA2 06CDA4 06CDA6 06CDA8 06CDAA 06CDAC 06CDAE
online_words = 06CDB0 06CDB2 06CDB4 06CDB6 06CDB8 06CDBA 06CDBC 06CDBE 06CDC0 06CDC2 06CDC4 06CDC6
online_words = 06CDC8 06CDCA 06CDCC 06CDCE 06CDD0 06CDD2 06CDD4 06CDD6 06CDD8 06CDDA 06CDDC 06CDDE
online_words = 06CDE0 06CDE2 06CDE4 06CDE6 06CDE8 06CDEA 06CE54 06CE56 06CE58 06CE5A 06CE5C 06CE5E
