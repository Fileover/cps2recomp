#
# The Punisher (Capcom 1993, CPS-1 arcade board with QSound): per-game settings read by the cps2recomp
# toolkit (Makefile, tools and launcher via tools/gamecfg.py).

name = The Punisher
# What the window is called (the name stays the folder the player's settings are kept under)
title = The Punisher Recomp
id = punisher
app_id = io.github.tmcleroy.thepunisher
disclaimer = Not affiliated with Capcom.

# The ROM set this port is made from, as arcade ROM collections name it, and the name the launcher shows.
# punisheru is the USA release (930422); the parent set, punisher, is the World one.
rom_set = punisheru
rom_parent = punisher
rom_name = The Punisher (USA 930422)

# The board: a CPS-1 with QSound (machine/romset.h), whose first eight program files are pairs, even bytes then odd
# (pairs=4). Its CPS-B chip (CPS-B-21, set up as MAME's table has it, QS3): layer control, the four priority masks,
# palette control, the layer enable bits (byte offsets, hex), then its ID register and the value it gives there,
# which the game checks as it starts (000598)
board = cps1 pairs=4
cps_b = 12 14 16 08 0A 0C 04 02 20 0E 0C00

# The set's files, each with its CRC32 (file:crc ...), in the order they sit on the board.
# program: the 68000's ROMs (four pairs of bytes, then one of 16-bit words). graphics: four files side by side per row (64-bit words).
# sound_program: the Z80's ROM (its first 0x8000 bytes enciphered: machine/kabuki.h). samples: the QSound chip's.
# No key file: the board's program is not enciphered.
program = psu_26.11e:9236d121 psu_30.11f:8320e501 psu_27.12e:61c960a1 psu_31.12f:78d4c298 psu_24.9e:1cfecad7 psu_28.9f:bdf921c1 psu_25.10e:c51acc94 psu_29.10f:52dce1ca ps_21.6f:8affa5a9
graphics = ps-1m.3a:77b7ccab ps-3m.5a:0122720b ps-2m.4a:64fa58d4 ps-4m.6a:60da42c8 ps-5m.7a:c54ea839 ps-7m.9a:04c5acbd ps-6m.8a:a544f4cc ps-8m.10a:8f02f436
sound_program = ps_q.5k:49ff4446
samples = ps-q1.1k:31fd8726 ps-q2.2k:980a9eef ps-q3.3k:0dd44491 ps-q4.4k:bed42f03

# Two players, and what the game calls its two buttons (the launcher's Controllers page shows these)
players = 2
buttons = Attack | Jump

# Where the game's code ends in the 68000's ROM (hex): the translator does not look past this
code_end = 180000

# Features that help made-up play get far when looking for the game's code ('make explore')
explore_features = free_play,infinite_health,infinite_time,infinite_lives

# check_release.sh: the features the ladder movie is played with (made-up play: Start, then walking on and attacking)
release_features = free_play,infinite_health,infinite_time,infinite_lives
