#
# Hyper Street Fighter II: The Anniversary Edition (Capcom 2004, CPS-2 arcade board): per-game settings read by the
# cps2recomp toolkit (Makefile, tools and launcher via tools/gamecfg.py).

name = Hyper Street Fighter II
# The series the collection's launcher puts it under, with the other games of it
series = Street Fighter II
# What the window is called (the name stays the folder the player's settings are kept under)
title = Hyper Street Fighter II Recomp
id = hsf2
app_id = io.github.tmcleroy.hsf2
disclaimer = Not affiliated with Capcom.

# The ROM set this port is made from, as arcade ROM collections name it, and the name the launcher shows.
# hsf2 is the USA 040202 set, the parent, the one Fightcade and FBNeo's training mode play.
rom_set = hsf2
rom_parent =
rom_name = Hyper Street Fighter II: The Anniversary Edition (USA 040202)

# The set's files, each with its CRC32 (file:crc ...), in the order they sit on the board.
# program: the 68000's ROMs (16-bit words), all eight sockets (4 MB). graphics: four files side by side (64-bit
# words), one row of 8 MB files. sound_program: the Z80's ROMs. samples: the QSound chip's. key: the board's cipher key.
program = hs2u.03:b308151e hs2u.04:327aa49c hs2.05:dde34a35 hs2.06:f4e56dda hs2.07:ee4420fc hs2.08:c9441533 hs2.09:3fc638a8 hs2.10:20d0f9e4
graphics = hs2.13m:a6ecab17 hs2.15m:10a0ae4d hs2.17m:adfa7726 hs2.19m:bb3ae322
sound_program = hs2.01:c1a13786 hs2.02:2d8794aa
samples = hs2.11m:0e15c359
key = hsf2.key:fc9b18c9

# Other sets of the same game this port plays as well: other regions whose program is the same code as this set's
# (here the region is a word of data, 0012A0, which the game reads from the ROM: 00126A), with the same graphics and
# sound. One a line: set | name | its program files | its key. (hsf2j1, Japan 031222, is an earlier revision: not taken.)
other_set = hsf2a | Hyper Street Fighter II: The Anniversary Edition (Asia 040202) | hs2a.03:d50a17e0 hs2a.04:a27f42de hs2.05:dde34a35 hs2.06:f4e56dda hs2.07:ee4420fc hs2.08:c9441533 hs2.09:3fc638a8 hs2.10:20d0f9e4 | hsf2a.key:2cd9eb99
other_set = hsf2j | Hyper Street Fighter II: The Anniversary Edition (Japan 040202) | hs2j.03c:6efe661f hs2j.04b:93f2500a hs2j.05:dde34a35 hs2j.06:f4e56dda hs2j.07:ee4420fc hs2j.08:c9441533 hs2j.09:3fc638a8 hs2j.10:20d0f9e4 | hsf2j.key:19455a93
# The program's words where these sets and this one differ as the game reads them (the region). Online, the host
# sends its own, so two players with different sets play as the host's.
online_words = 0012A0
# (and the data each side of a table at 00368A, read pc-relative with a fighter's place on the screen as the index: off
# the screen it reads past the table, deciphered, which is the key's noise and differs where the keys do; Super
# Turbo's table at 00329E, the same. Found replaying the check's online match on the Asia set with the program's words
# taken from this set's over ranges, halving them until one was left)
online_words = 00355A 00355C 00355E 003560 003562 003564
online_words = 00380A 00380C 00380E 003810 003812 003814 003816 003818 00381A 00381C 00381E 003820

# Features whose switch is on the launcher's first page, under "Full screen": name | title | what it says
display = widescreen | Widescreen | Fights are shown and played in 16:9, with more of the stage on each side.

# The launcher's Multi game page's modes this game takes part in (endless: its endless battle, every stage once;
# --multi, fight/battle.h)
multi = endless

# Where the game's code ends in the 68000's ROM (hex): the translator does not look past this.
code_end = 400000

# Features that help made-up play get far when looking for the game's code ('make explore')
explore_features = free_play,no_damage,one_hit
# ... and with which one made-up player wins every match, for the one-player game to its end
explore_ladder_features = free_play,no_damage,one_hit

# Capcom's video library, native in the toolkit (video/lifts.cpp, docs/NATIVE_VIDEO.md): where this game's copy of
# each part is. video_palette_commit: the routine, and its version (a CRC-32 of its instruction words, operands left
# out); video_writes: the instructions that write the video's registers (the palette's, the object registers, the object
# bank, the scrolls and layers: the toolkit checks each is a move or clr it reads)
video_writes = 0000F0 000110 000118 000120 000128 000130 000138 000140 000148 000150 000158 000160
video_writes = 000168 000170 0001A8 0001B0 0001B8 0001C0 0001C8 0001D0 000376 000384 000392 0003A0
video_writes = 0003AE 0003C8 0003DC 0003EA 0003F8 000406 000414 000422 000430 00043E 000446 00044E
video_writes = 000456 000620 000658 000684 000910 000958 001CE0 001D14 001D32 001D3A 001D84 001D8C
video_writes = 001DCC 001DD4 001DDC 001DE4 001DEC 001E16 001E20 001E26 001E2E 001E36 001F0A 001F1E
video_writes = 001F2E 001FEE 001FF6 001FFE 002006 00200E 002016 002116 00211E 002126 00212E 002136
video_writes = 00213E 00214A 002152 00215A 002162 00216A 002172 00217C 002184 00218E 002196 00219E
video_writes = 0021A6 0021AE 0021B6 0021C0 0021C8 0021D2 0021DA 0021E2 0021EA 0021F2 0021FA 002204
video_writes = 00220C 002214 00221E 002226 00222E 002236 00223E 002246 00224E 002258 002260 002268
video_writes = 002272 00227A 002282 00228A 002292 00229A 0022A4 0022B4 0022BC 0022C4 0022CC 0022DC
video_writes = 0022E2 0022EA 0022F4 0022FC 002306 00230E 002316 00231E 002326 00232E 002340 002346
video_writes = 002358 00235E 002366 00236E 002376 00237E 003A4C 0DA806

# The games whose stages it shows, each run from its own stage code alone (fight/all_guests.h, in that order, and
# fight/guest_stages.h; their sets from their own game.cfg): all but Super Turbo, whose stages are this game's own.
# None is needed to play: without them, only this game's.
guests = dstlk vampire_savior sfa2 sfa3 sfa nwarr msh xmvsf mshvsf mvsc xmcota pocket_fighter
