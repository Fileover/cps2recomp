# Dimahoo (Eighting/Raizing, licensed to Capcom, 2000; CPS-2 arcade board): per-game settings read by the cps2recomp
# toolkit (Makefile, tools and launcher via tools/gamecfg.py).

name = Dimahoo
# What the window is called (the name stays the folder the player's settings are kept under)
title = Dimahoo Recomp
# The group the collection's launcher puts it under, with the other games of its kind (game.cfg's series)
series = Shoot-'em-ups
id = dimahoo
app_id = io.github.tmcleroy.dimahoo
disclaimer = Not affiliated with Capcom, Eighting or Raizing.

# The ROM set this port is made from, as arcade ROM collections name it, and the name the launcher shows.
# dimahoou is the USA release (000121); MAME's parent, dimahoo, is the European set of the same date.
rom_set = dimahoou
rom_parent = dimahoo
rom_name = Dimahoo (USA 000121)

# The set's files, each with its CRC32 (file:crc ...), in the order they sit on the board.
program = gmdu.03:43bcb15f gmd.04:37485567 gmd.05:da269ffb gmd.06:55b483c9
graphics = gmd.13m:80dd19f0 gmd.15m:dfd93a78 gmd.17m:16356520 gmd.19m:dfc33031
sound_program = gmd.01:3f9bc985 gmd.02:3fd39dde
samples = gmd.11m:06a65542 gmd.12m:50bc7a31
key = dimahoou.key:8254d7ab

# Other sets of the same game this port plays as well: other regions whose program is the same code as this set's,
# with the same graphics and sound. One a line: set | name | its program files | its key. (Each differs from this set in
# three words of data: two of the vectors' table, 000030 and 000038, and the region the boot copies, 007F8A.)
other_set = dimahoo | Dimahoo (Europe 000121) | gmde.03:968fcecd gmd.04:37485567 gmd.05:da269ffb gmd.06:55b483c9 | dimahoo.key:7d6d2db9
other_set = gmahou | Great Mahou Daisakusen (Japan 000121) | gmdj.03:cd6979e3 gmd.04:37485567 gmd.05:da269ffb gmd.06:55b483c9 | gmahou.key:76a5e659
# The program's words where these sets and this one differ as the game reads them: the three words of data, and the bytes
# the boot's ROM check adds up (008106: every 4,095th byte of each 512 KB, as on the chips, where the keys differ).
# Online, the host sends its own, so two players with different sets play as the host's.
