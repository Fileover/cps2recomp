# Progear (Cave/Capcom 2001, CPS-2 arcade board): per-game settings read by the cps2recomp toolkit
# (Makefile, tools and launcher via tools/gamecfg.py).

name = Progear
# What the window is called (the name stays the folder the player's settings are kept under)
title = Progear Recomp
# The group the collection's launcher puts it under, with the other games of its kind (game.cfg's series)
series = Shoot-'em-ups
id = progear
app_id = io.github.tmcleroy.progear
disclaimer = Not affiliated with Capcom or Cave.

# The ROM set this port is made from, as arcade ROM collections name it, and the name the launcher shows.
# progearu is the USA release (010117); every region's set is of that one date. (MAME's parent, progear, is the
# European set; older collections gave the USA files the parent's name.)
rom_set = progearu
rom_parent = progear
rom_name = Progear (USA 010117)

# The set's files, each with its CRC32 (file:crc ...), in the order they sit on the board. The graphics are on SIMMs:
# eight files, each one byte of the 64-bit words, joined with '+'.
program = pgau.03:343a783e pgau.04:16208d79
graphics = pga-simm.01c:452f98b0+pga-simm.01d:9e672092+pga-simm.01a:ae9ddafe+pga-simm.01b:94d72d94+pga-simm.03c:48a1886d+pga-simm.03d:172d7e37+pga-simm.03a:9ee33d98+pga-simm.03b:848dee32
sound_program = pga.01:bdbfa992
samples = pga-simm.05a:c0aac80c pga-simm.05b:37a65d86 pga-simm.06a:d3f1e934 pga-simm.06b:8b39489a
key = progearu.key:46736b17

# Other sets of the same game this port plays as well: other regions whose program is the same code as this set's
# (the region in the header), with the same graphics and sound. One a line: set | name | its program files | its key.
# (Japan's program differs all through, its own words and text; Europe's was not found to compare.)
other_set = progeara | Progear (Asia 010117) | pgaa.03:25e6e2ce pgaa.04:8104307e | progeara.key:30a0fab6
# The program's words where these sets and this one differ as the game reads them: the header's region and checksum,
# and the bytes the boot's ROM check adds up (00026A: every 4,095th byte of each 512 KB, as on the chips, where the keys
# differ). Online, the host sends its own, so two players with different sets play as the host's.
online_words = 0000C2 0000D0 0000D2
online_words = 000000 000FFE 001FFE 002FFC 005FFA 006FF8 007FF8 008FF6 00AFF4 00BFF4 00CFF2 00DFF2
online_words = 00EFF0 00FFF0 010FEE 011FEE 032FCC 033FCC 038FC6 039FC6 03AFC4 03BFC4 03CFC2 03FFC0
online_words = 040FBE 041FBE 042FBC 043FBC 044FBA 045FBA 046FB8 047FB8 048FB6 049FB6 04CFB2 04DFB2
online_words = 04FFB0 050FAE 051FAE 052FAC 053FAC 054FAA 056FA8 058FA6 059FA6 05AFA4 05BFA4 05CFA2
online_words = 05DFA2 05FFA0 060F9E 062F9C 063F9C 064F9A 065F9A 066F98 068F96 069F96 06AF94 06BF94
online_words = 06CF92 06DF92 06EF90 06FF90 070F8E 071F8E 072F8C 075F8A 077F88 078F86 079F86 07AF84
online_words = 07BF84 07CF82 07EF80 07FF80 080000 080FFE 081FFE 083FFC 084FFA 085FFA 08AFF4 08CFF2
online_words = 08DFF2 08EFF0 08FFF0 090FEE 091FEE 092FEC 093FEC 094FEA 095FEA 096FE8 099FE6 09AFE4
online_words = 09BFE4 09CFE2 09DFE2 0A0FDE 0A6FD8

# Two players, and what the game calls its three buttons (the launcher's Controllers page shows these)
players = 2
buttons = Shot | Bomb | Rapid shot

# Where the game's code ends in the 68000's ROM (hex): the translator does not look past this
code_end = 100000

# Features that help made-up play get far when looking for the game's code ('make explore')
explore_features = free_play,invincible
explore_ladder_features = free_play,invincible
release_features = free_play,invincible
