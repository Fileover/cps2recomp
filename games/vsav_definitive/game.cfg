#
# Vampire Savior Definitive: Vampire Savior (vsavj, the arcade version played competitively) with the characters
# the games Capcom made from its program have and it has not, taken from them. Per-game settings read by the
# cps2recomp toolkit (Makefile, tools and launcher via tools/gamecfg.py).

name = Vampire Savior Definitive
# The series the collection's launcher puts it under, with the other games of it
series = Darkstalkers
# What the window is called (the name stays the folder the player's settings are kept under)
title = Vampire Savior Definitive
id = vsav_definitive
app_id = io.github.tmcleroy.vampiresaviordefinitive
disclaimer = Not affiliated with Capcom.

# The ROM set this port is made from: Vampire Savior's own
rom_set = vsavj
rom_parent = vsav
rom_name = Vampire Savior: The Lord of Vampire (Japan 970519)
program = vm3j.03d:2a2e74a4 vm3j.04d:1c2427bc vm3j.05a:95ce88d5 vm3j.06b:2c4297e0 vm3j.07b:a38aaae7 vm3j.08a:5773e5c9 vm3j.09b:d064f8b9 vm3j.10b:434518e9
graphics = vm3.13m:fd8a11eb vm3.15m:dd1e7d4e vm3.17m:6b89445e vm3.19m:3830fdc7 vm3.14m:c1a28e6c vm3.16m:194a7304 vm3.18m:df9a9f47 vm3.20m:c22fc3d9
sound_program = vm3.01:f778769b vm3.02:cc09faa1
samples = vm3.11m:e80e956e vm3.12m:9cd71557
key = vsavj.key:36d28ab8

# The set the other characters are taken from (Vampire Savior 2), seen by the 68000 from extra_base on
extra_set = vsav2
extra_name = Vampire Savior 2: The Lord of Vampire (Japan 970913)
extra_base = A00000
extra_program = vs2j.03:89fd86b4 vs2j.04:107c091b vs2j.05:61979638 vs2j.06:f37c5bc2 vs2j.07:8f885809 vs2j.08:2018c120 vs2j.09:fac3c217 vs2j.10:eb490213
extra_graphics = vs2.13m:5c852f52 vs2.15m:a20f58af vs2.17m:39db59ad vs2.19m:00c763a7 vs2.14m:cd09bd63 vs2.16m:e0182c15 vs2.18m:778dc4f6 vs2.20m:605d9d1d
extra_sound_program = vs2.01:35190139 vs2.02:c32dba09
extra_samples = vs2.11m:d67e47b7 vs2.12m:6d020a14
extra_key = vsav2.key:289028ce

# Features whose switch is on the launcher's first page, under "Full screen": name | title | what it says
display = widescreen | Widescreen | Fights are shown and played in 16:9, with more of the stage on each side.

# The launcher's Multi game page's modes this game takes part in (endless: its endless battle, every stage once;
# --multi, fight/battle.h)
multi = endless

# Vampire Savior's program: its sources are built too (the places they name are this game's own: family.h)
sources = vampire_savior

# Four players' controls: the team battle's tag-team modes (the Alternative modes page) give each fighter of a team a
# person of its own. The board itself reads players 1 and 2.
players = 4

# Where the game's code ends in the 68000's ROM (hex): the translator does not look past this
code_end = 100000

# Features that help made-up play get far when looking for the game's code ('make explore')
explore_features = free_play,no_damage,one_hit


# The games whose stages it shows, each run from its own stage code alone (fight/all_guests.h, in that order, and
# fight/guest_stages.h; their sets from their own game.cfg). None is needed to play: without them, only this game's.
guests = dstlk sfa2 sfa3 ssf2t sfa nwarr msh xmvsf mshvsf mvsc xmcota pocket_fighter cybots

# Capcom's video library, native in the toolkit (video/lifts.cpp, docs/NATIVE_VIDEO.md): where this game's copy of
# each part is. video_palette_commit: the routine, and its version (a CRC-32 of its instruction words, operands left
# out); video_writes: the instructions that write the video's registers (the palette's, the object registers, the object
# bank, the scrolls and layers: the toolkit checks each is a move or clr it reads)
video_palette_commit = 001762:770DFAA6
video_writes = 000926 000936 00093E 000946 00094E 000956 00099C 0009A4 0009AC 0009B4 0009BC 0009C4
video_writes = 0009CC 0009F4 0009FC 000A04 000A0C 000B8A 000B92 000B9A 000BA2 000BAA 000BB2 000BBA
video_writes = 000BC0 000BC6 000BCC 000BD2 000BD8 000BE0 000BE8 000BF0 000BF8 000C00 000C08 000C10
video_writes = 000C18 000C20 000C28 000E2E 000E4C 001078 00122C 00125C 001288 001296 0012A4 0012B2
video_writes = 0012C0 0012C8 0012D0 0012D8 0012E0 0012E8 0012F0 001378 001388 001390 0013A0 00153C
video_writes = 001548 001626 001630 001642 001656 001668 00167C 001690 0016A4 0016BA 0016C4 0016D6
video_writes = 0016EA 0016FC 00171C 00172E 001742
