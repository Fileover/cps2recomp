#
# Ghouls'n Ghosts (Capcom 1988, CPS-1 arcade board): per-game settings read by the cps2recomp toolkit (Makefile,
# tools and launcher via tools/gamecfg.py). A first port: the game as the board plays it, translated, with its FM
# music and effects (YM2151), and no sources of its own yet.

# (no apostrophe or colon: the name is also the folder the player's settings are kept under)
name = Ghouls n Ghosts
# What the window is called (the name stays the folder the player's settings are kept under)
title = Ghouls n Ghosts Recomp
id = ghouls
app_id = io.github.tmcleroy.ghouls
disclaimer = Not affiliated with Capcom.

# The ROM set this port is made from, as arcade ROM collections name it, and the name the launcher shows.
# ghouls is the World release, the parent set.
rom_set = ghouls
rom_parent = ghouls
rom_name = Ghouls'n Ghosts (World)

# The board: a classic CPS-1 with no QSound (machine/romset.h), its 68000 at 10 MHz (MAME's cps1_10MHz). Its
# CPS-B-01: layer control, the four priority masks, palette control, the layer enable bits (byte offsets, hex)
board = cps1-classic pairs=2
cpu_clock = 10
cps_b = 26 28 2A 2C 2E 30 02 04 08
# Its graphics mapper (the PAL DM620, as MAME's table has it): banks of 8000, 2000 and 2000; scroll 3's tiles from
# 8000 in the second bank, objects 2000-3fff in the third, everything else in the first. The first row that matches
# is the one taken.
gfx_map = 8000 2000 2000 | scroll3:8000-bfff:1 objects:2000-3fff:2 objects:0-1ffff:0 scroll1:0-1ffff:0 scroll2:0-1ffff:0 scroll3:0-1ffff:0
# The DIP switches (banks A, B and C, hex), as the boards left the factory: 1 coin 1 credit, difficulty 2, a bonus life
# at 30K, 60K and every 70K, 3 lives, the demonstrations' sound, continues allowed
dip = FF FD FF
# The Board page (the menu's and the launcher's): the DIP switches by name, each "As the board is set" (dip, above)
# unless chosen. name | title | bank:bits | description | choice=value ... (MAME's ghouls inputs)
board_option_1 = board_difficulty | Difficulty | B:0-2 | How hard the game is. A new board: 2. Takes effect after Reset: the board reads it as it starts. | 1 (easiest)=4 | 2=5 | 3=6 | 4 (normal)=7 | 5=3 | 6=2 | 7=1 | 8 (hardest)=0
board_option_2 = board_lives | Lives | C:0-1 | Lives for each credit. A new board: 3. Takes effect after Reset: the board reads it as it starts. | 3=3 | 4=2 | 5=1 | 6=0
board_option_3 = board_extend | Bonus life | B:4-5 | The scores that give a life. A new board: 30K, 60K and every 70K. Takes effect after Reset: the board reads it as it starts. | 10K, 30K and every 30K=2 | 20K, 50K and every 70K=1 | 30K, 60K and every 70K=3 | 40K, 70K and every 80K=0
board_option_4 = board_continue | Continue | C:6 | Whether a game over can be continued. A new board: yes. Takes effect after Reset: the board reads it as it starts. | No=0 | Yes=1
board_option_5 = board_demo_sound | Demo sound | C:5 | Whether the attract mode plays sound. A new board: on. Takes effect after Reset: the board reads it as it starts. | Off=0 | On=1

# The Cheats page: writes to the work RAM before every frame while a cheat is on, only while a game is played (the word
# at FF035C is 000D through a game, deaths too, and never before one: the board's RAM test, which a write would
# upset, walks single bits through every word). name | title |
# description | [when ADDR.s=VAL |] choice: ADDR.s=VAL ... Found here with RAM dumps and traces through the first stage
# (--dump-ram, --trace) and pokes from a save state (--poke): Arthur's lives a byte at FF07AD (3 at the start, 2 after a
# death); his armour a byte at FF07AC (2 armour, 1 none, 3 the gold armour); his weapon a byte at FF07C6 (0 lance,
# 1 dagger, 2 torch, 4 axe, 5 discus; 3, 6 and 7 are not weapons, 10 and on hang the game); the clock at FF06D2
# (minutes, then seconds in BCD).
cheat_1 = cheat_lives | Infinite lives | Arthur's lives stay at 5. | when FF035C.w=000D | On: FF07AD.b=05
cheat_2 = cheat_time | Infinite time | The stage's clock stays at 2:59. | when FF035C.w=000D | On: FF06D2.w=0259
cheat_3 = cheat_armour | Armour | Arthur keeps his armour: a hit takes it and it is back at once, so enemies cannot kill him (a fall still does). | when FF035C.w=000D | Steel: FF07AC.b=02 | Gold: FF07AC.b=03
cheat_4 = cheat_weapon | Weapon | Arthur's weapon, whatever he picks up. | when FF035C.w=000D | Lance: FF07C6.b=00 | Dagger: FF07C6.b=01 | Torch: FF07C6.b=02 | Axe: FF07C6.b=04 | Discus: FF07C6.b=05
# (free play: the credits, the byte FF0647, kept at 9 once the board's start-up is over, which the word FF0002 says
# (00FF from the attract mode on; the start-up's memory test walks single bits through it). Its board has no free
# play switch, and the collection's launcher sets free_play on every game.)
cheat_5 = free_play | Free play | Start without coins: the credits stay at 9. | when FF0002.w=00FF | On: FF0647.b=09

# Capcom's video library, native in the toolkit (video/lifts.cpp, docs/NATIVE_VIDEO.md): video_writes, the
# instructions that write the video's registers (CPS-A's, and CPS-B's layer control, priority masks and palette
# control; not its multiplier at 800140): every move or clr to one in the listing, with those a census of the smoke
# movie saw (CPS2RECOMP_VIDEO_CENSUS)
video_writes = 00048E 0004A2 0004B8 0004CE 0004E6 0004FE 000512 00051A 000522 000530 00053E 000546
video_writes = 000554 00055A 000560 000566 00056C 000574 061924 06192C 061934 06193C 061944 06194C
video_writes = 061954 06195C 061D1E 061D26 064156 064162 064168 06416E 064174 06417E 064396 06439C

# The set's files, each with its CRC32 (file:crc ...), in the order they sit on the board.
# program: the 68000's ROMs: two pairs of files giving the even and odd bytes (board's pairs=2), then a file of 16-bit words
# high byte first (/be). graphics: four files side by side (two bytes of the 64-bit words each), then two groups of
# eight joined files (a byte each). sound_program: the Z80's ROM. No samples: the board has no OKI ROMs, no voices.
program = dme_29.10h:166a58a2 dme_30.10j:7ac8407a dme_27.9h:f734b2be dme_28.9j:03d3e714 dm-17.7j:3ea1b0f2/be
graphics = dm-05.3a:0ba9c0b0 dm-07.3f:5d760ab9 dm-06.3c:4ba90b59 dm-08.3g:4bdee9de 09.4a:ae24bb19+18.7a:d34e271a+13.4e:3f70dd37+22.7e:7e69e2e6+11.4c:37c9b6c6+20.7c:2f1345b4+15.4g:3c2a212a+24.7g:889aac05 10.4b:bcc0f28c+19.7b:2a40166a+14.4f:20f85c03+23.7f:8426144b+12.4d:da088d61+21.7d:17e11df0+16.4h:f187ba1c+25.7h:29f79c78
sound_program = 26.10a:3692f6e5
samples =

# Two players taking turns, and what the game calls its two buttons (the launcher's Controllers page shows these)
players = 2
buttons = Fire | Jump

# Where the game's code ends in the 68000's ROM (hex): the translator does not look past this (the whole program
# until made-up play shows where the code stops)
code_end = 100000
