online_words = 03CFC2 03DFC2 03EFC0 03FFC0 040FBE 041FBE 042FBC 043FBC 044FBA 045FBA 046FB8 047FB8
online_words = 048FB6 049FB6 04AFB4 04BFB4 04CFB2 04DFB2 04EFB0 04FFB0 050FAE 051FAE 052FAC 053FAC
online_words = 054FAA 055FAA 056FA8 057FA8 058FA6 059FA6 05AFA4 05BFA4 05CFA2 05DFA2 05EFA0 05FFA0
online_words = 060F9E 061F9E 062F9C 063F9C 064F9A 065F9A 066F98 067F98 068F96 069F96 06AF94 06BF94
