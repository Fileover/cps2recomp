#
# Street Fighter Alpha 3 (Capcom 1998, CPS-2 arcade board): per-game settings read by the
# cps2recomp toolkit (Makefile, tools and launcher via tools/gamecfg.py).

name = Street Fighter Alpha 3
# What the window is called (the name stays the folder the player's settings are kept under)
title = Street Fighter Alpha 3 Recomp
id = sfa3
app_id = io.github.tmcleroy.sfa3
disclaimer = Not affiliated with Capcom.

# The ROM set this port is made from, as arcade ROM collections name it, and the name the launcher shows.
# sfa3u is the USA 980904 revision: the last one, the one played in tournaments and online (Fightcade's and FBNeo's
# training scripts play 980904; the parent sfa3 is the same revision for Europe).
rom_set = sfa3u
rom_parent = sfa3
rom_name = Street Fighter Alpha 3 (USA 980904)

# The set's files, each with its CRC32 (file:crc ...), in the order they sit on the board.
# program: the 68000's ROMs (16-bit words). graphics: four files side by side per row (64-bit words).
# sound_program: the Z80's ROMs. samples: the QSound chip's. key: the board's cipher key.
program = sz3u.03c:e007da2e sz3u.04c:5f78f0e7 sz3.05c:57fd0a40 sz3.06c:f6305f8b sz3.07c:6eab0f6f sz3.08c:910c4a3b sz3.09c:b29e5199 sz3.10b:deb2ff52
graphics = sz3.13m:0f7a60d9 sz3.15m:8e933741 sz3.17m:d6e98147 sz3.19m:f31a728a sz3.14m:5ff98297 sz3.16m:52b5bdee sz3.18m:40631ed5 sz3.20m:763409b4
sound_program = sz3.01:de810084 sz3.02:72445dc4
samples = sz3.11m:1c89eed1 sz3.12m:f392b13a
key = sfa3u.key:4a8f98c1

# Other sets of the same game this port plays as well: other regions whose program is the same code as this set's
# (the region in the header, or in one instruction: region_at), with the same graphics and sound. One a line:
# set | name | its program files | its key.
other_set = sfa3 | Street Fighter Alpha 3 (Europe 980904) | sz3e.03c:9762b206 sz3e.04c:5ad3f721 sz3.05c:57fd0a40 sz3.06c:f6305f8b sz3.07c:6eab0f6f sz3.08c:910c4a3b sz3.09c:b29e5199 sz3.10b:deb2ff52 | sfa3.key:54fa39c6
other_set = sfz3a | Street Fighter Zero 3 (Asia 980904) | sz3a.03d:d7e140d6 sz3a.04d:e06869a2 sz3.05c:57fd0a40 sz3.06c:f6305f8b sz3.07c:6eab0f6f sz3.08c:910c4a3b sz3.09c:b29e5199 sz3.10b:deb2ff52 | sfz3a.key:09045d61
other_set = sfa3h | Street Fighter Alpha 3 (Hispanic 980904) | sz3h.03c:b3b563a3 sz3h.04c:47891fec sz3.05c:57fd0a40 sz3.06c:f6305f8b sz3.07c:6eab0f6f sz3.08c:910c4a3b sz3.09c:b29e5199 sz3.10b:deb2ff52 | sfa3h.key:1b34998c
# Where the region is put in a variable (move.w #region,d16(a5)), not read from the header: with another set the
# variable is given that set's region once the instruction is past (the translated code has this set's).
region_at = 00101C

# Features whose switch is on the launcher's first page, under "Full screen": name | title | what it says
display = widescreen | Widescreen | Fights are shown and played in 16:9, with more of the stage on each side.

# The launcher's Multi game page's modes this game takes part in (endless: its endless battle, every stage once;
# --multi, fight/battle.h)
multi = endless

# Where the game's code ends in the 68000's ROM (hex): the translator does not look past this
code_end = 100000

# Features that help made-up play get far when looking for the game's code ('make explore')
explore_features = free_play,no_damage,one_hit
# ... and with which one made-up player wins every match, for the one-player game to its end
explore_ladder_features = free_play,no_damage,one_hit

# check_release.sh: how many of the ladder's pictures the build with no translated code may show a frame early
release_allowed = 150
