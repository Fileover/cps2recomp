#
# Marvel Super Heroes vs. Street Fighter (Capcom 1997, CPS-2 arcade board): per-game settings read by the cps2recomp
# toolkit (Makefile, tools and launcher via tools/gamecfg.py).

name = Marvel Super Heroes vs. Street Fighter
# What the window is called (the name stays the folder the player's settings are kept under)
title = Marvel Super Heroes vs. Street Fighter Recomp
id = mshvsf
app_id = io.github.tmcleroy.mshvsf
disclaimer = Not affiliated with Capcom or Marvel.

# The ROM set this port is made from, as arcade ROM collections name it, and the name the launcher shows.
# mshvsf is the parent set, and the one FBNeo and Fightcade play.
rom_set = mshvsf
rom_parent =
rom_name = Marvel Super Heroes Vs. Street Fighter (Europe 970625)

# The set's files, each with its CRC32 (file:crc ...), in the order they sit on the board.
# program: the 68000's ROMs (16-bit words). graphics: four files side by side per row (64-bit words).
# sound_program: the Z80's ROMs. samples: the QSound chip's. key: the board's cipher key.
program = mvse.03f:b72dc199 mvse.04f:6ef799f9 mvs.05a:1a5de0cb mvs.06a:959f3030 mvs.07b:7f915bdb mvs.08a:c2813884 mvs.09b:3ba08818 mvs.10b:cf0dba98
graphics = mvs.13m:29b05fd9 mvs.15m:faddccf1 mvs.17m:97aaf4c7 mvs.19m:cb70e915 mvs.14m:b3b1972d mvs.16m:08aadb5d mvs.18m:c1228b35 mvs.20m:366cc6c2
sound_program = mvs.01:68252324 mvs.02:b34e773d
samples = mvs.11m:86219770 mvs.12m:f2fd7f68
key = mshvsf.key:64660867

# Other sets of the same game this port plays as well: other regions whose program is the same code as this set's
# (the region in the header, or in one instruction: region_at), with the same graphics and sound. One a line:
# set | name | its program files | its key.
other_set = mshvsfu1 | Marvel Super Heroes Vs. Street Fighter (USA 970625) | mvsu.03d:ae60a66a mvsu.04d:91f67d8a mvs.05a:1a5de0cb mvs.06a:959f3030 mvs.07b:7f915bdb mvs.08a:c2813884 mvs.09b:3ba08818 mvs.10b:cf0dba98 | mshvsfu.key:4c04797b
other_set = mshvsfj2 | Marvel Super Heroes Vs. Street Fighter (Japan 970625) | mvsj.03g:fdfa7e26 mvsj.04g:c921825f mvs.05a:1a5de0cb mvs.06a:959f3030 mvs.07b:7f915bdb mvs.08a:c2813884 mvs.09b:3ba08818 mvs.10b:cf0dba98 | mshvsfj.key:565eeebb
other_set = mshvsfh | Marvel Super Heroes Vs. Street Fighter (Hispanic 970625) | mvsh.03f:4f60f41e mvsh.04f:dc08ec12 mvs.05a:1a5de0cb mvs.06a:959f3030 mvs.07b:7f915bdb mvs.08a:c2813884 mvs.09b:3ba08818 mvs.10b:cf0dba98 | mshvsfh.key:b93d576f
other_set = mshvsfa | Marvel Super Heroes Vs. Street Fighter (Asia 970625) | mvsa.03f:5b863716 mvsa.04f:4886e65f mvs.05a:1a5de0cb mvs.06a:959f3030 mvs.07b:7f915bdb mvs.08a:c2813884 mvs.09b:3ba08818 mvs.10b:cf0dba98 | mshvsfa.key:6810a3af
other_set = mshvsfb1 | Marvel Super Heroes Vs. Street Fighter (Brazil 970625) | mvsb.03f:9c4bb950 mvsb.04f:d3320d13 mvs.05a:1a5de0cb mvs.06a:959f3030 mvs.07b:7f915bdb mvs.08a:c2813884 mvs.09b:3ba08818 mvs.10b:cf0dba98 | mshvsfb.key:3f5bb6e4

# Features whose switch is on the launcher's first page, under "Full screen": name | title | what it says
display = widescreen | Widescreen | Fights are shown and played in 16:9, with more of the stage on each side.

# The launcher's Multi game page's modes this game takes part in (endless: its endless battle, every stage once;
# --multi, fight/battle.h)
multi = endless

# Four players' controls: the tag-team modes (the Alternative modes page) give each character of a team a person
# of its own. The board itself reads players 1 and 2.
players = 4

# Where the game's code ends in the 68000's ROM (hex): the translator does not look past this
code_end = 100000

# Features that help made-up play get far when looking for the game's code ('make explore')
explore_features = free_play,no_damage,one_hit
# ... and with which one made-up player wins every match, for the one-player game to its end
explore_ladder_features = free_play,no_damage,one_hit

# check_release.sh: how many of the ladder's pictures the build with no translated code may show a frame early
release_allowed = 150
