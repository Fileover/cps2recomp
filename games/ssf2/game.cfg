#
# Super Street Fighter II: The New Challengers (Capcom 1993, CPS-2 arcade board): per-game settings read by the
# cps2recomp toolkit (Makefile, tools and launcher via tools/gamecfg.py).

name = Super Street Fighter II
# The series the collection's launcher puts it under, with the other games of it
series = Street Fighter II
# What the window is called (the name stays the folder the player's settings are kept under)
title = Super Street Fighter II Recomp
id = ssf2
app_id = io.github.tmcleroy.ssf2
disclaimer = Not affiliated with Capcom.

# The ROM set this port is made from, as arcade ROM collections name it, and the name the launcher shows.
# ssf2 is the World 931005 release, the parent set and the last revision.
rom_set = ssf2
rom_parent =
rom_name = Super Street Fighter II: The New Challengers (World 931005)

# The set's files, each with its CRC32 (file:crc ...), in the order they sit on the board.
# program: the 68000's ROMs (16-bit words). graphics: four files side by side per row (64-bit words), two rows
# here (the first of 2 MB files, then one of 1 MB files). sound_program: the Z80's ROM. samples: the QSound chip's.
# key: the board's cipher key.
program = ssfe-03b:af654792 ssfe.04:b082aa67 ssfe.05:02b9c137 ssfe-06b:1c8e44a8 ssfe.07:2409001d
graphics = ssf.13m:cf94d275 ssf.15m:5eb703af ssf.17m:ffa60e0f ssf.19m:34e825c5 ssf.14m:b7cc32e7 ssf.16m:8376ad18 ssf.18m:f5b1b336 ssf.20m:459d5c6b
sound_program = ssf-01a:71fcdfc9
samples = ssf.q01:a6f9da5c ssf.q02:8c66ae26 ssf.q03:695cc2ca ssf.q04:9d9ebe32 ssf.q05:4770e7b7 ssf.q06:4e79c951 ssf.q07:cdd14313 ssf.q08:6f5a088c
key = ssf2.key:e469ccbb

# Features whose switch is on the launcher's first page, under "Full screen": name | title | what it says
display = widescreen | Widescreen | Fights are shown and played in 16:9, with more of the stage on each side.

# The launcher's Multi game page's modes this game takes part in (endless: its endless battle, every stage once;
# --multi, fight/battle.h)
multi = endless

# The games whose sources this one builds too: Super Turbo's (games/ssf2t/src), which name its places as At(0x...);
# family.h says where they are in this game, and what is this game's own
sources = ssf2t

# Where the game's code ends in the 68000's ROM (hex): the translator does not look past this
code_end = 280000

# Features that help made-up play get far when looking for the game's code ('make explore')
explore_features = free_play,no_damage,one_hit
explore_ladder_features = free_play,no_damage,one_hit
