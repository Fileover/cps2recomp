#
# X-Men: Children of the Atom (Capcom 1994, CPS-2 arcade board): per-game settings read by the cps2recomp toolkit
# (Makefile, tools and launcher via tools/gamecfg.py).

name = X-Men: Children of the Atom
# The series the collection's launcher puts it under, with the other games of it
series = Marvel
# What the window is called (the name stays the folder the player's settings are kept under)
title = X-Men: Children of the Atom Recomp
id = xmcota
app_id = io.github.tmcleroy.xmcota
disclaimer = Not affiliated with Capcom or Marvel.

# The ROM set this port is made from, as arcade ROM collections name it, and the name the launcher shows.
# xmcota is the parent set, the last revision (950331), and the one FBNeo and Fightcade play (the USA set is 950105).
rom_set = xmcota
rom_parent =
rom_name = X-Men: Children of the Atom (Euro 950331)

# The set's files, each with its CRC32 (file:crc ...), in the order they sit on the board.
# program: the 68000's ROMs (16-bit words). graphics: four files side by side per row (64-bit words).
# sound_program: the Z80's ROMs. samples: the QSound chip's. key: the board's cipher key.
program = xmne.03f:5a726d13 xmne.04f:06a83f3a xmne.05b:87b0ed0f xmn.06a:1b86a328 xmn.07a:2c142a44 xmn.08a:f712d44f xmn.09a:9241cae8 xmne.10b:cb36b0a4
graphics = xmn.13m:bf4df073 xmn.15m:4d7e4cef xmn.17m:513eea17 xmn.19m:d23897fc xmn.14m:778237b7 xmn.16m:67b36948 xmn.18m:015a7c4c xmn.20m:9dde2758
sound_program = xmn.01a:40f479ea xmn.02a:39d9b5ad
samples = xmn.11m:c848a6bc xmn.12m:729c188f
key = xmcota.key:6665bbfb

# Other sets of the same game this port plays as well: other regions whose program is the same code as this set's
# (the region in the header, or in one instruction: region_at), with the same graphics and sound. One a line:
# set | name | its program files | its key.

# Other sets of the same game this port plays as well: other regions whose program is the same code as this set's
# (here the region and the program's checksum, data words at 000D26 and 000D36), with the same graphics and sound. One a
# line: set | name | its program files | its key.
other_set = xmcotah | X-Men: Children of the Atom (Hispanic 950331) | xmnh.03f:e4b85a90 xmnh.04f:7dfe1406 xmnh.05b:87b0ed0f xmn.06a:1b86a328 xmn.07a:2c142a44 xmn.08a:f712d44f xmn.09a:9241cae8 xmnh.10b:cb36b0a4 | xmcotah.key:c9a45a5a
other_set = xmcotab | X-Men: Children of the Atom (Brazil 950331) | xmnb.03c:ab48bcb0 xmnb.04c:8d8fcbb1 xmne.05b:87b0ed0f xmn.06a:1b86a328 xmn.07a:2c142a44 xmn.08a:f712d44f xmn.09a:9241cae8 xmne.10b:cb36b0a4 | xmcotab.key:bb70f10f

# Features whose switch is on the launcher's first page, under "Full screen": name | title | what it says
display = widescreen | Widescreen | Fights are shown and played in 16:9, with more of the stage on each side.

# The launcher's Multi game page's modes this game takes part in (endless: its endless battle, every stage once;
# --multi, fight/battle.h)
multi = endless

# Where the game's code ends in the 68000's ROM (hex): the translator does not look past this
code_end = 100000

# Features that help made-up play get far when looking for the game's code ('make explore')
explore_features = free_play,no_damage,one_hit
# ... and with which one made-up player wins every match, for the one-player game to its end
explore_ladder_features = free_play,no_damage,one_hit

# Capcom's video library, native in the toolkit (video/lifts.cpp, docs/NATIVE_VIDEO.md): where this game's copy of
# each part is. video_palette_commit: the routine, and its version (a CRC-32 of its instruction words, operands left
# out); video_writes: the instructions that write the video's registers (the palette's, the object registers, the object
# bank, the scrolls and layers: the toolkit checks each is a move or clr it reads)
video_writes = 000110 00011A 000122 000128 00012E 000134 00017A 000188 0001B6 0001BE 0001C6 0001CE
video_writes = 0001E8 0001FA 000202 00020A 000212 000218 00021E 000504 00052C 000588 000598 00059E
video_writes = 0005A6 0005AE 0005B6 00064A 000652 000696 00069E 0006A6 0006AE 0006B6 0006CA 0006E6
video_writes = 0006EE 0006F6 0006FE 000706 000736 000760 00076E 00077C 000790 00079A 0007A4 0007AC
video_writes = 0007B4 0007BC 0007C4 0007D2 0007DA 0007E2 0007EA 0007F2 0007FA 000860 0008A6 06E95E
video_writes = 06E966 06E96E 06EA12 06EA1A 06EA22 06EA2A 06EA32 06EA3A 081F04 08245C 08247C
