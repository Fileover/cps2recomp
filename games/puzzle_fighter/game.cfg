#
# Super Puzzle Fighter II Turbo (Capcom 1996, CPS-2 arcade board): per-game settings read by the
# cps2recomp toolkit (Makefile, tools and launcher via tools/gamecfg.py).

name = Super Puzzle Fighter II Turbo
title = Super Puzzle Fighter II Turbo Recomp
id = puzzle_fighter
app_id = io.github.tmcleroy.puzzlefighter
disclaimer = Not affiliated with Capcom.

# The ROM set this port is made from, as arcade ROM collections name it, and the name the launcher shows.
# spf2t is the parent set.
rom_set = spf2t
rom_parent =
rom_name = Super Puzzle Fighter II Turbo (Europe 960529)

# The set's files, each with its CRC32 (file:crc ...), in the order they sit on the board.
# program: the 68000's ROMs (16-bit words). graphics: four files side by side per row (64-bit words);
# this board has only the last row of sockets filled, so the list starts at @800000.
# sound_program: the Z80's ROMs. samples: the QSound chip's. key: the board's cipher key.
program = pzfe.03:2af51954 pzf.04:b80649e2
graphics = @800000 pzf.14m:2d4881cb pzf.16m:4b0fd1be pzf.18m:e43aac33 pzf.20m:7f536ff1
sound_program = pzf.01:600fb2a3 pzf.02:496076e0
samples = pzf.11m:78442743 pzf.12m:399d2c7b
key = spf2t.key:4c4dc7e3

# Where the game's code ends in the 68000's ROM (hex): the translator does not look past this
code_end = 100000

# Features that help made-up play get far when looking for the game's code ('make explore')
explore_features = free_play,no_attack_2
explore_ladder_features = free_play,no_attack_2,quick_win
explore_ladder_features_2 = free_play,no_attack_2,quick_win,challenger

# check_release.sh: how many of the ladder's pictures the build with no translated code may show a frame early,
# and the features its ladder is played with
release_allowed = 150
release_features = free_play,quick_win
